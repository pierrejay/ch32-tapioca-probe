# STM32G431 SWD-only profile for the CH32X035 PIOC CMSIS-DAP probe.
source [find openocd/ch32x035-pioc-swd.cfg]
source [find target/stm32g4x.cfg]

# Keep initial attach and reset-start on the probe's fixed timing profile.
adapter speed 1000
reset_config none
stm32g4x.cpu configure -event reset-start { adapter speed 1000 }

proc g431_program {image} {
    reset halt
    flash write_image erase $image
    verify_image $image
    reset run
}
