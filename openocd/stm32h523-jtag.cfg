# Validated STM32H523 JTAG debug profile for the CH32X035 CMSIS-DAP probe.
source [find interface/cmsis-dap.cfg]
cmsis_dap_backend usb_bulk
cmsis_dap_vid_pid 0x1209 0xc0ca
cmsis_dap_usb interface 0
transport select jtag
adapter speed 500

# WeActStudio STM32H523 core board: ARM debug port followed by the STM32
# boundary-scan TAP. This minimal profile supports core debug and memory access;
# it deliberately does not configure an STM32 flash driver.
jtag newtap h523 dp -irlen 4 -expected-id 0x6ba00477
jtag newtap h523 bs -irlen 5 -expected-id 0x06478041

dap create h523.dap -chain-position h523.dp
target create h523.cm33 cortex_m -dap h523.dap -ap-num 1
