# Validated STM32H523 profile for the CH32X035 PIOC CMSIS-DAP probe.
source [find openocd/ch32x035-pioc-swd.cfg]
source [find target/stm32h5x.cfg]

# Request the fixed nominal 1 MHz probe profile.
adapter speed 1000

# The ST r7 target script calls mem2array on its mem_ap pseudo-target, while
# this OpenOCD build exposes read_memory instead. The hook is optional debug
# policy, not part of target discovery or flash programming.
stm32h5x.cpu configure -event examine-end {}

# Force the driver's direct MEM-AP writer. It is slower, but it can restore a
# completely blank/locked-up Cortex because it executes no flash loader code.
stm32h5x.cpu configure -work-area-size 0

proc h523_halt {} {
    stm32h5x.cpu mww 0xE000EDF0 0xA05F0003
    sleep 50
    poll
}

proc h523_run_vectors {} {
    set vectors [stm32h5x.cpu read_memory 0x08000000 32 2]
    targets stm32h5x.cpu
    reg msp [lindex $vectors 0]
    reg pc [lindex $vectors 1]
    reg xpsr 0x01000000
    resume
}

proc h523_program {image} {
    h523_halt
    flash write_image erase $image 0x08000000 bin
    verify_image $image 0x08000000 bin
    h523_run_vectors
}
