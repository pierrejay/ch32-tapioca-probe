[platformio]
default_envs = jtagswd

[common]
platform = ch32v@1.1.0
board = genericCH32X035F8U6
framework = noneos-sdk
upload_protocol = isp
; upload_protocol = minichlink
base_build_flags =
    -I src
    -I src/hal
# Per-product include paths, kept separate so a header basename present in both
# products (e.g. protocol.hpp in dirtyjtag/ and wchlink/) resolves unambiguously
# per build - no include prefixing needed.
arm_includes =
    -I src/dirtyjtag
    -I src/swd
    -I src/usb
wch_includes =
    -I src/wchlink
    -I src/usb
base_build_src_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -Wall
    -Wextra

[env:jtagswd]
extends = common
board_build.ldscript = ldscript/Link_CH32X035_pioc.ld
extra_scripts = pre:scripts/verify_pioc.py
# DirtyJTAG + CMSIS-DAP product (ARM). Include-only source filter: compiles exactly
# its own modules + the shared HAL, never the WCH personality or a second main().
build_src_filter =
    -<*>
    +<main_jtagswd.cpp>
    +<hal/>
    +<dirtyjtag/>
    +<swd/>
    +<usb/usb_dirtyjtag.cpp>
build_flags =
    ${common.base_build_flags}
    ${common.arm_includes}
build_src_flags =
    ${common.base_build_src_flags}

[env:wchlink]
extends = common
board_build.ldscript = ldscript/Link_CH32X035_pioc.ld
extra_scripts = pre:scripts/verify_pioc.py
# Default WCH-Link firmware. Ch32WchAutoPort detects RVSWIO or RVSWD per target.
build_src_filter =
    -<*>
    +<main_wchlink.cpp>
    +<hal/>
    +<wchlink/>
    +<usb/usb_wchlink.cpp>
build_flags =
    ${common.base_build_flags}
    ${common.wch_includes}
build_src_flags =
    ${common.base_build_src_flags}

[env:wchlink-rvswio]
# Diagnostic build: one-wire RVSWIO only (CH32V003-class targets).
extends = env:wchlink
build_flags =
    ${common.base_build_flags}
    ${common.wch_includes}
    -D WCH_TRANSPORT_RVSWIO

[env:wchlink-rvswio-emit]
# Continuously emits a known RVSWIO frame on PC19 for logic-analyser capture.
extends = env:wchlink
build_flags =
    ${common.base_build_flags}
    ${common.wch_includes}
    -D WCH_TRANSPORT_RVSWIO
    -D WCH_EMIT_SELFTEST

[env:wchlink-rvswd]
# Diagnostic build: two-wire RVSWD only (CH32V20x/30x targets).
extends = env:wchlink
build_flags =
    ${common.base_build_flags}
    ${common.wch_includes}
    -D WCH_TRANSPORT_RVSWD

[env:wchlink-rvswd-emit]
# Continuously emits a known RVSWD frame for logic-analyser capture.
extends = env:wchlink
build_flags =
    ${common.base_build_flags}
    ${common.wch_includes}
    -D WCH_TRANSPORT_RVSWD
    -D WCH_EMIT_SELFTEST
